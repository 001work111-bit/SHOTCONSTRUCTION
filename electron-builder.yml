# Конфигурация упаковки (npm run dist).
# Основные настройки дублируются в package.json → build, этот файл
# нужен, если собираете через `electron-builder --config electron-builder.yml`.

appId: com.shotconstruction.app
productName: Shot Construction

directories:
  output: release
  buildResources: build-resources

files:
  - dist/**/*
  - electron/**/*
  - package.json

asar: true

win:
  target:
    - nsis
    - portable
  artifactName: ${productName}-${version}-${arch}.${ext}

mac:
  target:
    - dmg
  category: public.app-category.graphics-design
  artifactName: ${productName}-${version}-${arch}.${ext}

linux:
  target:
    - AppImage
  category: Graphics
  artifactName: ${productName}-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
